name: 缺陷反馈
description: 报告可复现的功能异常、界面问题或可用性问题
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。GitHub Issue 是公开内容，请勿填写游戏 UID、管理链接、管理凭据、Passkey、恢复码、Cookie、Token 或其他敏感信息。截图和录屏也请先脱敏。

        安全漏洞、凭据泄露和隐私风险请勿在此公开提交，请通过维护者 GitHub 主页私下联系。

  - type: input
    id: summary
    attributes:
      label: 问题摘要
      description: 用一句话说明发生了什么。
      placeholder: 例如：切换语言后，匹配结果仍显示旧语言
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 页面或功能
      description: 填写发生问题的页面、入口或操作，不要粘贴管理链接。
      placeholder: 例如：发布需求、搜索结果、/{lang}/manage
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供从进入页面开始的最小、明确步骤。
      placeholder: |
        1. 打开...
        2. 选择...
        3. 输入...
        4. 点击...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？如有报错，请提供脱敏后的错误文本。
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      description: 问题出现在哪个环境？
      options:
        - 线上站点
        - 本地开发环境
        - 不确定
    validations:
      required: true

  - type: input
    id: browser_device
    attributes:
      label: 浏览器与设备
      description: 提供浏览器版本、操作系统和设备型号；不必提供设备唯一标识。
      placeholder: 例如：Safari 19，iPhone 16，iOS 19
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: 界面语言
      options:
        - 简体中文
        - 繁体中文
        - English
        - 日本語
        - 한국어
        - Русский
        - Deutsch
        - Français
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 影响程度
      options:
        - 阻塞：无法执行核心流程
        - 严重：功能结果错误或重要操作失败
        - 一般：功能可用但行为异常
        - 轻微：视觉、文案或低频体验问题
        - 不确定
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 补充材料
      description: 可拖入已脱敏的截图或录屏，并说明无法复现的条件。不要包含 UID、管理链接或任何凭据。
      placeholder: 拖入图片或录屏，或填写其他补充说明。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已删除或遮挡所有个人、管理和安全敏感信息。
          required: true

