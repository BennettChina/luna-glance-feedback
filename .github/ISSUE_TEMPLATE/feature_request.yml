name: 功能建议
description: 提出与 Luna Glance 产品目标一致的新功能或改进建议
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        Luna Glance 聚焦匿名发布、同区匹配和安全的游戏 UID 披露，不计划提供玩家账户、站内私信、支付、担保、跨区匹配或交易履约服务。

        请描述需要解决的问题和期望结果。GitHub Issue 是公开内容，请勿提交 UID、管理凭据或其他敏感信息。

  - type: input
    id: summary
    attributes:
      label: 建议摘要
      description: 用一句话描述建议。
      placeholder: 例如：为匹配结果增加按有效期筛选
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程有什么困难？谁会受到影响？
      placeholder: 描述真实场景、频率和现有替代做法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述期望的用户体验和可观察结果，不必限定具体技术实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些其他做法？它们为何不够好？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      description: 建议主要影响哪个功能？
      options:
        - 发布交换需求
        - 搜索与匹配
        - 管理交换需求
        - 举报与复核
        - 卡牌或服务器目录
        - 界面、无障碍或响应式布局
        - 多语言与文案
        - 其他
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: 影响与权衡
      description: 说明可能的隐私、安全、性能、可访问性或使用成本，以及是否影响现有流程。
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 参考材料
      description: 可提供已脱敏的草图、截图或公开链接。不要上传包含个人信息或管理凭据的内容。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我理解维护者会结合产品边界、风险和实现成本评估该建议。
          required: true

